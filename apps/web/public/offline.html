<!doctype html>
<html lang="ar" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Vertex Connect</title>
<style>
  :root { color-scheme: light dark; --bg: #f4f3ef; --card: #fff; --ink: #18181b; --muted: #6b6b76; --line: #e7e5df; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111113; --card: #1a1a1d; --ink: #f4f4f5; --muted: #a1a1aa; --line: #2a2a2e; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  main { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px; text-align: center; }
  svg { display: block; margin: 0 auto; }
  h1 { font-size: 19px; margin: 16px 0 4px; }
  p { margin: 0; color: var(--muted); font-size: 14px; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  button { margin-top: 22px; width: 100%; min-height: 44px; border: 0; border-radius: 12px; background: #2563eb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <svg width="48" height="48" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#2563eb"/><g transform="translate(9 10) scale(0.94)" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7.5 L16 25 L25.5 7.5"/><path d="M12.5 9.5 L16 16.5 L19.5 9.5" opacity=".55"/></g><circle cx="33" cy="17" r="2.45" fill="#fff"/></svg>
  <div dir="rtl">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>ستفتح الصفحة فور عودة الاتصال.</p>
  </div>
  <hr>
  <div dir="ltr">
    <h1>You're offline</h1>
    <p>The page will open as soon as you're back online.</p>
  </div>
  <button type="button" onclick="location.reload()">إعادة المحاولة · Try again</button>
</main>
<script>addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
