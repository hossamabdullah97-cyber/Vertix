packages:
  - "apps/*"
  - "packages/*"
  # mobile is a standalone Expo app (installed with its own package manager)
  # to avoid React Native's known conflicts with pnpm's strict node_modules.
  - "!apps/mobile"
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
