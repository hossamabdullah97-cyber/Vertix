packages:
  - "apps/*"
  - "packages/*"
  # mobile is a standalone Expo app (installed with its own package manager)
  # to avoid React Native's known conflicts with pnpm's strict node_modules.
  - "!apps/mobile"
  # zapier is the app published to Zapier's platform with its CLI (zapier push),
  # with that platform's own dependencies; its tests need none.
  - "!apps/zapier"
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true

# Patched versions of packages that come in through others, for known
# vulnerabilities (pnpm audit). Each stays within the major its parent uses.
overrides:
  multer: ^2.4.0
  proxy-addr: ^2.0.8
  qs: ^6.16.0
  body-parser@1: ^1.20.8
  lodash: ^4.18.1
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  glob@10: ^10.5.0
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  tmp: ^0.2.7
  picomatch@4: ^4.0.7
  fast-uri@3: ^3.1.8
  ajv@8: ^8.20.0
  webpack: ^5.111.1
  browserslist: ^4.29.3
  nanoid@3: ^3.3.20
  postcss: ^8.5.29
  source-map-js: ^1.2.2
  baseline-browser-mapping: ^2.11.27
  vite: ^7.3.7
