services:
  postgres:
    image: postgres:16-alpine
    container_name: vertex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vertex
      POSTGRES_PASSWORD: vertex
      POSTGRES_DB: vertex_connect
    ports:
      - "5432:5432"
    volumes:
      - vertex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vertex -d vertex_connect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vertex_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vertex_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vertex_pgdata:
  vertex_redisdata:
