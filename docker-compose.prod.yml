# Production: Caddy (HTTPS) in front of the web app and the API, Postgres,
# Redis, and a daily database backup. Only Caddy is reachable from outside.
#
#   1. Point APP_DOMAIN and API_DOMAIN (and TAP_DOMAIN, if you use one) at
#      this server, with ports 80 and 443 open: Caddy gets the certificates.
#   2. Fill .env (see .env.example, "Production" at its end).
#   3. docker compose -f docker-compose.prod.yml up --build -d
#
# Every variable in .env reaches the API (env_file); the ones set below are
# the values that must differ inside this network.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN, e.g. app.example.com}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN, e.g. api.example.com}
      TAP_DOMAIN: ${TAP_DOMAIN:-}
      # Where Let's Encrypt writes about the certificates.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vertex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vertex_connect}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vertex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vertex}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vertex_connect}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${APP_DOMAIN}}
      # Caddy is one proxy in front of the API; add any CDN in front of it.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
      # Image storage (S3 / Cloudflare R2). Without it, uploads are lost on redeploy.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # Wallet passes: each is offered on cards only when its values are set.
      APPLE_PASS_TYPE_ID: ${APPLE_PASS_TYPE_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_PASS_CERT: ${APPLE_PASS_CERT:-}
      APPLE_PASS_KEY: ${APPLE_PASS_KEY:-}
      APPLE_PASS_KEY_PASSPHRASE: ${APPLE_PASS_KEY_PASSPHRASE:-}
      APPLE_WWDR_CERT: ${APPLE_WWDR_CERT:-}
      GOOGLE_WALLET_ISSUER_ID: ${GOOGLE_WALLET_ISSUER_ID:-}
      GOOGLE_WALLET_SERVICE_ACCOUNT: ${GOOGLE_WALLET_SERVICE_ACCOUNT:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Emailed when a new error shows up, or a fixed one comes back.
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
      # Messages from the help page; empty = OPS_ALERT_EMAIL.
      SUPPORT_INBOX_EMAIL: ${SUPPORT_INBOX_EMAIL:-}
      # Billing with Paymob; off until the keys and plans are set.
      PAYMOB_BASE_URL: ${PAYMOB_BASE_URL:-https://accept.paymob.com}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
      PAYMOB_SECRET_KEY: ${PAYMOB_SECRET_KEY:-}
      PAYMOB_PUBLIC_KEY: ${PAYMOB_PUBLIC_KEY:-}
      PAYMOB_CARD_INTEGRATION_ID: ${PAYMOB_CARD_INTEGRATION_ID:-}
      PAYMOB_MOTO_INTEGRATION_ID: ${PAYMOB_MOTO_INTEGRATION_ID:-}
      PAYMOB_PLAN_PERSONAL: ${PAYMOB_PLAN_PERSONAL:-}
      PAYMOB_PLAN_PRO: ${PAYMOB_PLAN_PRO:-}
      PAYMOB_PLAN_BUSINESS: ${PAYMOB_PLAN_BUSINESS:-}
      PRICE_PERSONAL_EGP: ${PRICE_PERSONAL_EGP:-}
      PRICE_PRO_EGP: ${PRICE_PRO_EGP:-}
      PRICE_BUSINESS_EGP: ${PRICE_BUSINESS_EGP:-}
      # Who invoices come from (shown on each invoice), and the VAT inside the prices, if any.
      BILLING_SELLER_NAME: ${BILLING_SELLER_NAME:-}
      BILLING_SELLER_ADDRESS: ${BILLING_SELLER_ADDRESS:-}
      BILLING_SELLER_TAX_ID: ${BILLING_SELLER_TAX_ID:-}
      BILLING_SELLER_EMAIL: ${BILLING_SELLER_EMAIL:-}
      BILLING_VAT_PERCENT: ${BILLING_VAT_PERCENT:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://${API_DOMAIN}}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://${API_DOMAIN}/api}
        NEXT_PUBLIC_TAP_URL: ${NEXT_PUBLIC_TAP_URL:-}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-}
        NEXT_PUBLIC_COMPANY_ADDRESS: ${NEXT_PUBLIC_COMPANY_ADDRESS:-}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
        NEXT_PUBLIC_SUPPORT_PHONE: ${NEXT_PUBLIC_SUPPORT_PHONE:-}
    restart: unless-stopped
    environment:
      # The server renders cards with the API's data: it asks the API here,
      # passing on each visitor's address, so the API's per-address limits
      # count visitors rather than this server (Caddy would replace it).
      API_INTERNAL_URL: http://api:4000/api
      # The phone app opens the website's links (/.well-known/ files); empty = they open in the browser.
      APPLE_APP_IDS: ${APPLE_APP_IDS:-}
      ANDROID_PACKAGE: ${ANDROID_PACKAGE:-dev.vertex.connect}
      ANDROID_CERT_FINGERPRINTS: ${ANDROID_CERT_FINGERPRINTS:-}
    depends_on:
      - api

  # A compressed dump of the database at start-up and then every
  # BACKUP_INTERVAL_HOURS, kept here for BACKUP_KEEP_DAYS and, with
  # BACKUP_S3_BUCKET set, copied off this server (scripts/backup.sh).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "loop"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-vertex}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-vertex_connect}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-db}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./scripts/restore.sh:/scripts/restore.sh:ro
      - backups:/backups

volumes:
  pgdata:
  redisdata:
  backups:
  caddydata:
  caddyconfig:
